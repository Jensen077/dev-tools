name: Release

# 推 v* 标签触发：构建 macos(universal)/windows/ubuntu 三平台安装包，挂到该 tag 的草稿 Release
# 产物名带平台后缀：macos64 / windows64 / linux64（替换 Tauri 默认的架构段，便于区分下载）
# 自动更新：matrix 构建完成后，manifest job 收集签名生成 latest.json 清单上传到 Release
# 前置：需在仓库 Secrets 中配置 TAURI_SIGNING_PRIVATE_KEY 和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            bundle_dir: 'src-tauri/target/universal-apple-darwin/release/bundle'
            suffix: 'macos64'
          - platform: ubuntu-22.04
            args: ''
            bundle_dir: 'src-tauri/target/release/bundle'
            suffix: 'linux64'
          - platform: windows-latest
            args: ''
            bundle_dir: 'src-tauri/target/release/bundle'
            suffix: 'windows64'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ matrix.args }}

      - name: Collect and rename artifacts
        shell: bash
        run: |
          set -e
          mkdir -p artifacts sig-artifacts
          while IFS= read -r f; do
            base=$(basename "$f")
            newname=$(printf '%s' "$base" | sed -E "s/_universal/_${{ matrix.suffix }}/; s/_amd64/_${{ matrix.suffix }}/; s/_x64/_${{ matrix.suffix }}/")
            cp "$f" "artifacts/$newname"
          done < <(find '${{ matrix.bundle_dir }}' -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \))
          # macOS：收集 Tauri 自动生成的 .app.tar.gz（createUpdaterArtifacts 会生成）
          if [ -d '${{ matrix.bundle_dir }}/macos/devbox.app' ]; then
            auto_tar=$(find '${{ matrix.bundle_dir }}' -maxdepth 1 -name '*.app.tar.gz' | head -1)
            if [ -n "$auto_tar" ]; then
              base=$(basename "$auto_tar")
              newname=$(printf '%s' "$base" | sed -E "s/_universal/_${{ matrix.suffix }}/")
              cp "$auto_tar" "artifacts/$newname"
            else
              tar -czf "artifacts/devbox_${{ matrix.suffix }}.app.tar.gz" -C '${{ matrix.bundle_dir }}/macos' devbox.app
            fi
          fi
          # 签名文件单独收集到 sig-artifacts/，通过 workflow artifact 传递，不暴露到 Release
          find '${{ matrix.bundle_dir }}' -type f -name '*.sig' -exec cp {} sig-artifacts/ \;

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Devbox ${{ github.ref_name }}'
          body: '见 [VERSION.md](https://github.com/${{ github.repository }}/blob/main/VERSION.md) 的对应版本条目'
          draft: true
          prerelease: false
          files: artifacts/*

      - uses: actions/upload-artifact@v4
        with:
          name: sig-${{ matrix.suffix }}
          path: sig-artifacts/

  # 矩阵构建完成后，收集所有签名文件生成 latest.json 更新清单
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: sig-*
          path: sig-artifacts

      - name: Debug sig artifacts
        run: |
          echo "=== sig-artifacts tree ==="
          find sig-artifacts -type f | sort || echo "EMPTY"

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python3 -c "
          import json, os, glob, subprocess
          from datetime import datetime, timezone

          tag = os.environ['TAG']
          repo = os.environ['REPO']
          version = tag.lstrip('v')

          result = subprocess.run(
              ['gh', 'release', 'view', tag, '--json', 'assets', '--jq', '.[] | \"\\(.name)\t\\(.url)\"'],
              capture_output=True, text=True
          )
          assets = {}
          for line in result.stdout.strip().split('\n'):
              if '\t' in line:
                  name, url = line.split('\t', 1)
                  assets[name] = url

          print('Release assets:', json.dumps(list(assets.keys()), indent=2))

          platforms = {}

          # macOS universal：同时覆盖 darwin-x86_64 和 darwin-aarch64
          mac_sig = glob.glob('sig-artifacts/**/*.app.tar.gz.sig', recursive=True)
          print(f'macOS sig found: {mac_sig}')
          if mac_sig:
              with open(mac_sig[0]) as f:
                  sig = f.read().strip()
              tar_url = next((u for n, u in assets.items() if 'macos64' in n and n.endswith('.app.tar.gz')), None)
              if tar_url:
                  platforms['darwin-x86_64'] = {'signature': sig, 'url': tar_url}
                  platforms['darwin-aarch64'] = {'signature': sig, 'url': tar_url}

          # Linux (deb)
          linux_sig = glob.glob('sig-artifacts/**/*.deb.sig', recursive=True)
          print(f'Linux sig found: {linux_sig}')
          if linux_sig:
              with open(linux_sig[0]) as f:
                  sig = f.read().strip()
              deb_url = next((u for n, u in assets.items() if 'linux64' in n and n.endswith('.deb')), None)
              if deb_url:
                  platforms['linux-x86_64'] = {'signature': sig, 'url': deb_url}

          # Windows (msi)
          win_sig = glob.glob('sig-artifacts/**/*.msi.sig', recursive=True)
          print(f'Windows sig found: {win_sig}')
          if win_sig:
              with open(win_sig[0]) as f:
                  sig = f.read().strip()
              msi_url = next((u for n, u in assets.items() if 'windows64' in n and n.endswith('.msi')), None)
              if msi_url:
                  platforms['windows-x86_64'] = {'signature': sig, 'url': msi_url}

          manifest = {
              'version': version,
              'notes': f'See VERSION.md for details: https://github.com/{repo}/blob/main/VERSION.md',
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms
          }

          with open('latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print('Generated latest.json:')
          print(json.dumps(manifest, indent=2))
          "

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" latest.json --clobber --repo "${{ github.repository }}"