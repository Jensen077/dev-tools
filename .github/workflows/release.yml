name: Release

# 推 v* 标签触发：构建 macos(universal)/windows/ubuntu 三平台安装包，挂到该 tag 的草稿 Release
# 使用：git tag v1.0.7 && git push origin v1.0.7 → CI 构建并创建草稿 Release，审核后点 Publish
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # tauri-action 需创建/编辑 Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # mac universal：一个 dmg 同时支持 Apple Silicon 与 Intel
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          # Linux：deb + AppImage
          - platform: ubuntu-22.04
            args: ''
          # Windows：msi + nsis(.exe)
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # mac universal 需同时安装两个 target；其他平台留空（用 host 默认 target）
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Devbox ${{ github.ref_name }}'
          releaseBody: '见 [VERSION.md](https://github.com/${{ github.repository }}/blob/main/VERSION.md) 的对应版本条目'
          # 草稿模式：首个矩阵任务创建草稿 Release，后续任务挂资产到同一草稿
          # 全部构建完成后，到 Releases 页审核资产 → 点 Publish 发布
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
