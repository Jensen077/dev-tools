name: Release

# 推 v* 标签触发：构建 macos(universal)/windows/ubuntu 三平台安装包，挂到该 tag 的草稿 Release
# 使用：git tag v1.0.7 && git push origin v1.0.7 → CI 构建并创建草稿 Release，审核后点 Publish
# 产物名带平台后缀：macos64 / windows64 / linux64（替换 Tauri 默认的架构段，便于区分下载）
# 自动更新：matrix 构建完成后，manifest job 生成 latest.json 清单上传到 Release
# 前置：需在仓库 Secrets 中配置 TAURI_SIGNING_PRIVATE_KEY 和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # mac universal：一个 dmg 同时支持 Apple Silicon 与 Intel
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            bundle_dir: 'src-tauri/target/universal-apple-darwin/release/bundle'
            suffix: 'macos64'
          # Linux：deb + AppImage
          - platform: ubuntu-22.04
            args: ''
            bundle_dir: 'src-tauri/target/release/bundle'
            suffix: 'linux64'
          # Windows：msi + nsis(.exe)
          - platform: windows-latest
            args: ''
            bundle_dir: 'src-tauri/target/release/bundle'
            suffix: 'windows64'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # mac universal 需同时安装两个 target；其他平台留空（用 host 默认 target）
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ matrix.args }}

      # 把产物复制到 artifacts/ 并重命名：架构段（_universal/_amd64/_x64）替换为平台后缀
      # 同时收集 .sig 签名文件供 manifest job 生成 latest.json
      - name: Collect and rename artifacts
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          while IFS= read -r f; do
            base=$(basename "$f")
            newname=$(printf '%s' "$base" | sed -E "s/_universal/_${{ matrix.suffix }}/; s/_amd64/_${{ matrix.suffix }}/; s/_x64/_${{ matrix.suffix }}/")
            cp "$f" "artifacts/$newname"
          done < <(find '${{ matrix.bundle_dir }}' -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \))
          # macOS：收集 Tauri 自动生成的 .app.tar.gz（createUpdaterArtifacts 会生成）
          if [ -d '${{ matrix.bundle_dir }}/macos/devbox.app' ]; then
            # 优先使用 Tauri 自动生成的 .app.tar.gz（含 updater 签名）
            auto_tar=$(find '${{ matrix.bundle_dir }}' -maxdepth 1 -name '*.app.tar.gz' | head -1)
            if [ -n "$auto_tar" ]; then
              base=$(basename "$auto_tar")
              newname=$(printf '%s' "$base" | sed -E "s/_universal/_${{ matrix.suffix }}/")
              cp "$auto_tar" "artifacts/$newname"
            else
              tar -czf "artifacts/devbox_${{ matrix.suffix }}.app.tar.gz" -C '${{ matrix.bundle_dir }}/macos' devbox.app
            fi
          fi
          # 收集 .sig 签名文件（保留原名，供 manifest job 使用）
          find '${{ matrix.bundle_dir }}' -type f -name '*.sig' -exec cp {} artifacts/ \;

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Devbox ${{ github.ref_name }}'
          body: '见 [VERSION.md](https://github.com/${{ github.repository }}/blob/main/VERSION.md) 的对应版本条目'
          # 草稿模式：首个矩阵任务创建草稿 Release，后续任务把资产挂到同一草稿
          # 全部构建完成后，到 Releases 页审核资产 → 点 Publish 发布
          draft: true
          prerelease: false
          files: artifacts/*

  # 矩阵构建完成后，收集所有平台的签名文件生成 latest.json 更新清单
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir assets
          gh release download "$TAG" --dir assets --skip-existing 2>/dev/null || true

          python3 -c "
          import json, os, glob
          from datetime import datetime, timezone

          tag = os.environ['TAG']
          repo = os.environ['REPO']
          version = tag.lstrip('v')
          base_url = f'https://github.com/{repo}/releases/download/{tag}'

          platforms = {}

          # macOS universal：同时覆盖 darwin-x86_64 和 darwin-aarch64
          mac_sig = glob.glob('assets/*universal*.app.tar.gz.sig')
          if mac_sig:
              with open(mac_sig[0]) as f:
                  sig = f.read().strip()
              tar_name = os.path.basename(mac_sig[0]).replace('.sig', '').replace('_universal', '_macos64')
              # 如果重命名后的文件不存在，尝试原始文件名
              if not os.path.exists(f'assets/{tar_name}'):
                  tar_name = os.path.basename(mac_sig[0]).replace('.sig', '')
              url = f'{base_url}/{tar_name}'
              platforms['darwin-x86_64'] = {'signature': sig, 'url': url}
              platforms['darwin-aarch64'] = {'signature': sig, 'url': url}

          # Linux (deb)
          linux_sig = glob.glob('assets/*_amd64*.deb.sig')
          if linux_sig:
              with open(linux_sig[0]) as f:
                  sig = f.read().strip()
              deb_name = os.path.basename(linux_sig[0]).replace('.sig', '').replace('_amd64', '_linux64')
              if not os.path.exists(f'assets/{deb_name}'):
                  deb_name = os.path.basename(linux_sig[0]).replace('.sig', '')
              url = f'{base_url}/{deb_name}'
              platforms['linux-x86_64'] = {'signature': sig, 'url': url}

          # Windows (msi)
          win_sig = glob.glob('assets/*_x64*.msi.sig')
          if win_sig:
              with open(win_sig[0]) as f:
                  sig = f.read().strip()
              msi_name = os.path.basename(win_sig[0]).replace('.sig', '').replace('_x64', '_windows64')
              if not os.path.exists(f'assets/{msi_name}'):
                  msi_name = os.path.basename(win_sig[0]).replace('.sig', '')
              url = f'{base_url}/{msi_name}'
              platforms['windows-x86_64'] = {'signature': sig, 'url': url}

          manifest = {
              'version': version,
              'notes': f'See VERSION.md for details: https://github.com/{repo}/blob/main/VERSION.md',
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms
          }

          with open('latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print('Generated latest.json:')
          print(json.dumps(manifest, indent=2))
          "

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" latest.json --clobber