name: Release

# 推 v* 标签触发：构建 macos(universal)/windows/ubuntu 三平台安装包，挂到该 tag 的草稿 Release
# 使用：git tag v1.0.7 && git push origin v1.0.7 → CI 构建并创建草稿 Release，审核后点 Publish
# 产物名带平台后缀：macos64 / windows64 / linux64（替换 Tauri 默认的架构段，便于区分下载）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建/编辑 Release 需写权限

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # mac universal：一个 dmg 同时支持 Apple Silicon 与 Intel
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            bundle_dir: 'src-tauri/target/universal-apple-darwin/release/bundle'
            suffix: 'macos64'
          # Linux：deb + AppImage
          - platform: ubuntu-22.04
            args: ''
            bundle_dir: 'src-tauri/target/release/bundle'
            suffix: 'linux64'
          # Windows：msi + nsis(.exe)
          - platform: windows-latest
            args: ''
            bundle_dir: 'src-tauri/target/release/bundle'
            suffix: 'windows64'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # mac universal 需同时安装两个 target；其他平台留空（用 host 默认 target）
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm tauri build ${{ matrix.args }}

      # 把产物复制到 artifacts/ 并重命名：架构段（_universal/_amd64/_x64）替换为平台后缀
      # 排除 .app 应用包目录内部文件（只上传 dmg / tar.gz / msi / exe / deb / AppImage）
      - name: Collect and rename artifacts
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          while IFS= read -r f; do
            base=$(basename "$f")
            newname=$(printf '%s' "$base" | sed -E "s/_universal/_${{ matrix.suffix }}/; s/_amd64/_${{ matrix.suffix }}/; s/_x64/_${{ matrix.suffix }}/")
            cp "$f" "artifacts/$newname"
          done < <(find '${{ matrix.bundle_dir }}' -type f ! -path '*/*.app/*')

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Devbox ${{ github.ref_name }}'
          body: '见 [VERSION.md](https://github.com/${{ github.repository }}/blob/main/VERSION.md) 的对应版本条目'
          # 草稿模式：首个矩阵任务创建草稿 Release，后续任务把资产挂到同一草稿
          # 全部构建完成后，到 Releases 页审核资产 → 点 Publish 发布
          draft: true
          prerelease: false
          files: artifacts/*
