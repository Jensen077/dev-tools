<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>devbox 开发者工具箱</title>
    <style>
      /* 首帧兜底：React 挂载前即呈现背景色，避免白屏闪变。
         app.ts 加载后会按持久化主题覆盖 data-theme 并同步 CSS 变量 */

      body,
      #root {
        background: #ffffff;
        margin: 0;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
